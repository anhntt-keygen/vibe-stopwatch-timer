<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe Stopwatch & Timer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header Navigation Tabs -->
    <header class="app-header">
      <div class="logo">VIBE TIME</div>
      <nav class="tab-navigation">
        <button id="tab-stopwatch-btn" class="tab-btn active" onclick="switchTab('stopwatch')">Bấm Giờ</button>
        <button id="tab-timer-btn" class="tab-btn" onclick="switchTab('timer')">Hẹn Giờ</button>
      </nav>
    </header>

    <main class="app-content">
      <!-- SECTION 1: STOPWATCH -->
      <section id="stopwatch-section" class="tab-content active">
        <div class="display-wrapper">
          <div id="stopwatch-display" class="time-display">00:00:00.00</div>
        </div>

        <div class="controls-wrapper">
          <button id="sw-lap-btn" class="btn btn-secondary" disabled onclick="handleStopwatchLap()">Ghi Vòng</button>
          <button id="sw-start-btn" class="btn btn-primary" onclick="handleStopwatchStart()">Bắt đầu</button>
          <button id="sw-reset-btn" class="btn btn-danger" onclick="handleStopwatchReset()">Đặt lại</button>
        </div>

        <div class="laps-container">
          <h3>Danh sách vòng chạy</h3>
          <div class="table-wrapper">
            <table id="laps-table">
              <thead>
                <tr>
                  <th>Vòng</th>
                  <th>Thời gian vòng</th>
                  <th>Tổng thời gian</th>
                </tr>
              </thead>
              <tbody id="laps-list">
                <!-- Laps will be injected here dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- SECTION 2: TIMER -->
      <section id="timer-section" class="tab-content">
        <div class="timer-visualizer">
          <svg class="progress-ring" width="240" height="240">
            <circle class="progress-ring__background" stroke="#1e293b" stroke-width="8" fill="transparent" r="110" cx="120" cy="120"/>
            <circle id="timer-progress-bar" class="progress-ring__circle" stroke="#3b82f6" stroke-width="8" fill="transparent" r="110" cx="120" cy="120"/>
          </svg>
          <div id="timer-display" class="time-display">00:00:00</div>
        </div>

        <!-- Timer Input Selectors -->
        <div id="timer-inputs" class="timer-inputs-container">
          <div class="input-group">
            <label for="timer-hours">Giờ</label>
            <select id="timer-hours" class="time-select">
              <!-- Generated by JS -->
            </select>
          </div>
          <div class="input-group">
            <label for="timer-minutes">Phút</label>
            <select id="timer-minutes" class="time-select">
              <!-- Generated by JS -->
            </select>
          </div>
          <div class="input-group">
            <label for="timer-seconds">Giây</label>
            <select id="timer-seconds" class="time-select">
              <!-- Generated by JS -->
            </select>
          </div>
        </div>

        <div class="controls-wrapper">
          <button id="timer-cancel-btn" class="btn btn-danger" disabled onclick="handleTimerCancel()">Hủy</button>
          <button id="timer-start-btn" class="btn btn-primary" onclick="handleTimerStart()">Bắt đầu</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Audio element for Timer Alarm -->
  <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-500.wav" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
```
